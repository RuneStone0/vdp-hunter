el); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }\n.price.featured { border-color: rgba(125, 211, 252, 0.5); box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.15); }\n.price .amount { font-size: 2rem; font-weight: 700; color: #f1f8ff; margin: 6px 0 2px; }\n.price .amount span { font-size: 0.85rem; color: var(--muted); font-weight: 500; }\n.price ul { padding-left: 18px; color: var(--muted); font-size: 0.92rem; }\n.price li { margin: 6px 0; }\n\n.note {\n  border-left: 3px solid var(--accent-2); background: rgba(56, 189, 248, 0.07);\n  padding: 12px 16px; border-radius: 0 8px 8px 0; color: var(--muted); font-size: 0.92rem;\n}\n\nfooter {\n  margin-top: 72px; padding-top: 22px; border-top: 1px solid var(--line);\n  display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap;\n  color: var(--muted); font-size: 0.84rem;\n}\n.mono-small { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }\n\n.doc-nav { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }\n.doc-nav a {\n  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;\n  font-size: 0.82rem; color: var(--muted); background: rgba(13, 36, 55, 0.6);\n}\n.doc-nav a:hover { color: var(--accent); text-decoration: none; border-color: rgba(125, 211, 252, 0.4); }\n\n</style>\n</head>\n<body>\n<div class=\"shell\">\n\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <div class=\"brand-mark\">VH</div>\n      <div class=\"brand-name\">vdp-hunter</div>\n    </div>\n    <nav>\n      <a href=\"#data\">Data</a>\n      <a href=\"/guide\">Docs</a>\n      <a href=\"/docs\">API reference</a>\n      <a href=\"/pricing\">Pricing</a>\n      <a href=\"https://github.com/RuneStone0/vdp-hunter\">GitHub</a>\n    </nav>\n  </header>\n\n  <section class=\"hero\" style=\"margin-top:0\">\n    <div>\n      <p class=\"eyebrow\">Disclosure program intelligence</p>\n      <h1>The programs nobody<br><span class=\"accent\">puts on a list.</span></h1>\n      <p class=\"lede\">\n        Every bug bounty platform and one curated directory miss the same thing: organizations\n        that publish their own security policy. We crawl RFC 9116 <code>security.txt</code> across\n        the top million domains, merge that with HackerOne, Bugcrowd, Intigriti, YesWeHack and\n        disclose.io, and serve the result as one dataset with a full change history.\n      </p>\n      <div class=\"cta-row\">\n        <a class=\"btn btn-primary\" href=\"/guide\">Read the docs</a>\n        <a class=\"btn btn-ghost\" href=\"/docs\">OpenAPI reference</a>\n      </div>\n      <p class=\"mono-small\" style=\"margin-top:16px\">Data as of 2026-11-21 19:48 UTC \u00b7 MIT licensed code \u00b7 CC0 and MIT upstream data</p>\n    </div>\n    <div class=\"stat-grid\">\n      <div class=\"stat\"><div class=\"n\">6,247</div><div class=\"l\">Programs tracked</div></div>\n      <div class=\"stat\"><div class=\"n\">5,343</div><div class=\"l\">Self-managed</div></div>\n      <div class=\"stat\"><div class=\"n\">4,846</div><div class=\"l\">With a policy or mailbox</div></div>\n      <div class=\"stat\"><div class=\"n\">3,753</div><div class=\"l\">Changes recorded</div></div>\n    </div>\n  </section>\n\n  <section id=\"data\">\n    <h2>What is in the dataset</h2>\n    <p class=\"sub\">One row per registrable domain, with provenance on every field.</p>\n    <div class=\"table-wrap\">\n      <table>\n        <thead><tr><th>Source</th><th>What it contributes</th><th>Refresh</th><th>Coverage</th></tr></thead>\n        <tbody>\n          <tr><td>security.txt crawl</td><td>Self-managed policies, contact addresses, expiry state, first-seen dates</td><td>Every 15 min</td><td>Top-1M Tranco, continuous</td></tr>\n          <tr><td>HackerOne</td><td>Program identity, in-scope assets, bounty flag</td><td>Daily</td><td>448 programs</td></tr>\n          <tr><td>Bugcrowd</td><td>Program identity, in-scope assets, max payout</td><td>Daily</td><td>296 programs</td></tr>\n          <tr><td>Intigriti</td><td>Program identity, bounty range</td><td>Daily</td><td>144 programs</td></tr>\n          <tr><td>YesWeHack</td><td>Program identity, in-scope assets</td><td>Daily</td><td>52 programs</td></tr>\n          <tr><td>disclose.io</td><td>Self-hosted VDPs, safe-harbor status, contact</td><td>Daily</td><td>2,433 programs</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </section>\n\n  <section>\n    <h2>Why teams pay for this</h2>\n    <p class=\"sub\">The delta is the product. A list tells you what exists today; a change feed tells you what appeared last night.</p>\n    <div class=\"cards\">\n      <div class=\"card\">\n        <span class=\"tag\">Discovery</span>\n        <h3>Programs beyond the platforms</h3>\n        <p>A large share of organizations that accept reports never join a platform. If they publish a security.txt, they are in this dataset, with the address to write to.</p>\n      </div>\n      <div class=\"card\">\n        <span class=\"tag\">Change history</span>\n        <h3>Every add, removal and edit</h3>\n        <p><code>GET /v1/changes?since=</code> returns added, removed and changed rows with before and after values, so a monitor polls a few hundred bytes instead of pulling the full set.</p>\n      </div>\n      <div class=\"card\">\n        <span class=\"tag\">Attribution</span>\n        <h3>Know where a fact came from</h3>\n        <p>Each row carries its sources, whether the record came over a verified TLS chain, and the expiry state of the underlying policy file.</p>\n      </div>\n    </div>\n  </section>\n\n  <section>\n    <h2>Quick start</h2>\n    <p class=\"sub\">One header, one endpoint. JSON in, JSON out.</p>\n<pre>curl -s \"$VDP_BASE/v1/changes?since=2026-11-21T00:00:00Z&amp;kind=added\" \\\n  -H \"X-API-Key: $VDP_KEY\"</pre>\n<pre>{\n  \"data\": [\n    {\n      \"id\": 412,\n      \"ts\": \"2026-11-21T16:15:03+00:00\",\n      \"kind\": \"added\",\n      \"domain\": \"anthropic.com\",\n      \"after\": { \"policy\": \"https://www.anthropic.com/responsible-disclosure-policy\",\n                 \"expiry\": \"valid\", \"sources\": [\"securitytxt\"] }\n    }\n  ],\n  \"meta\": { \"count\": 1, \"total\": 1, \"has_more\": false, \"generated_at\": \"2026-11-21T16:20:00+00:00\" }\n}</pre>\n    <p class=\"note\">Full schema, filters, pagination and error codes are in the <a href=\"/guide\">developer guide</a>. The machine-readable contract is at <a href=\"/openapi.json\">/openapi.json</a>.</p>\n  </section>\n\n  <section>\n    <h2>Pricing</h2>\n    <p class=\"sub\">Free tier for evaluation and research. Paid tiers for production traffic and history depth.</p>\n    <div class=\"price-grid\">\n      <div class=\"price\">\n        <h3>Free</h3>\n        <div class=\"amount\">$0</div>\n        <ul><li>120 requests / minute</li><li>Current dataset</li><li>30 days of change history</li><li>Community support</li></ul>\n        <a class=\"btn btn-ghost\" href=\"/pricing\">Request a key</a>\n      </div>\n      <div class=\"price featured\">\n        <h3>Pro</h3>\n        <div class=\"amount\">$99<span> / month</span></div>\n        <ul><li>2,000 requests / minute</li><li>Full change history</li><li>Bulk export and CSV</li><li>Email support, 1 business day</li></ul>\n        <a class=\"btn btn-primary\" href=\"/pricing\">Start with Pro</a>\n      </div>\n      <div class=\"price\">\n        <h3>Enterprise</h3>\n        <div class=\"amount\">Talk to us</div>\n        <ul><li>Custom crawl scope</li><li>Webhooks on new programs</li><li>Historical backfill</li><li>SLA and named contact</li></ul>\n        <a class=\"btn btn-ghost\" href=\"/pricing\">Contact</a>\n      </div>\n    </div>\n  </section>\n\n  <footer>\n    <div>vdp-hunter \u00b7 data refreshed continuously \u00b7 <a href=\"/guide\">docs</a> \u00b7 <a href=\"/openapi.json\">openapi</a></div>\n    <div>Sources: HackerOne, Bugcrowd, Intigriti, YesWeHack, disclose.io, RFC 9116 crawl</div>\n  </footer>\n</div>\n</body>\n</html>\ 1px rgba(125, 211, 252, 0.15); }\n.price .amount { font-size: 2rem; font-weight: 700; color: #f1f8ff; margin: 6px 0 2px; }\n.price .amount span { font-size: 0.85rem; color: var(--muted); font-weight: 500; }\n.price ul { padding-left: 18px; color: var(--muted); font-size: 0.92rem; }\n.price li { margin: 6px 0; }\n\n.note {\n  border-left: 3px solid var(--accent-2); background: rgba(56, 189, 248, 0.07);\n  padding: 12px 16px; border-radius: 0 8px 8px 0; color: var(--muted); font-size: 0.92rem;\n}\n\nfooter {\n  margin-top: 72px; padding-top: 22px; border-top: 1px solid var(--line);\n  display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap;\n  color: var(--muted); font-size: 0.84rem;\n}\n.mono-small { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }\n\n.doc-nav { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }\n.doc-nav a {\n  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;\n  font-size: 0.82rem; color: var(--muted); background: rgba(13, 36, 55, 0.6);\n}\n.doc-nav a:hover { color: var(--accent); text-decoration: none; border-color: rgba(125, 211, 252, 0.4); }\n\n</style>\n</head>\n<body>\n<div class=\"shell\">\n\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <div class=\"brand-mark\">VH</div>\n      <div class=\"brand-name\">vdp-hunter</div>\n    </div>\n    <nav>\n      <a href=\"/\">Home</a>\n      <a href=\"/guide\">Docs</a>\n      <a href=\"/docs\">API reference</a>\n      <a href=\"/pricing\">Pricing</a>\n      <a href=\"https://github.com/RuneStone0/vdp-hunter\">GitHub</a>\n    </nav>\n  </header>\n\n  <p class=\"eyebrow\">Developer guide</p>\n  <h1 style=\"font-size:clamp(1.8rem,3.4vw,2.6rem)\">Build on the dataset</h1>\n  <p class=\"lede\">Everything here is served as JSON over HTTPS with a single API key header. The\n  machine-readable contract lives at <a href=\"/openapi.json\">/openapi.json</a>; the interactive\n  reference is at <a href=\"/docs\">/docs</a>.</p>\n\n  <div class=\"doc-nav\" style=\"margin-top:26px\">\n    <a href=\"#base\">Base URL</a>\n    <a href=\"#auth\">Authentication</a>\n    <a href=\"#limits\">Rate limits</a>\n    <a href=\"#programs\">Programs</a>\n    <a href=\"#changes\">Change feed</a>\n    <a href=\"#model\">Data model</a>\n    <a href=\"#errors\">Errors</a>\n    <a href=\"#cadence\">Cadence</a>\n  </div>\n\n  <section id=\"base\" style=\"margin-top:36px\">\n    <h2>Base URL</h2>\n<pre>https://api.vdphunter.com          # hosted\nhttp://localhost:8110              # self-hosted from the repo</pre>\n    <p class=\"sub\">Every endpoint below is relative to the base URL. Responses are\n    <code>application/json; charset=utf-8</code>.</p>\n  </section>\n\n  <section id=\"auth\">\n    <h2>Authentication</h2>\n    <p class=\"sub\">Pass your key in the <code>X-API-Key</code> header. Keys are issued per\n    customer and tier; revoking a key takes effect immediately.</p>\n<pre>curl -s \"$BASE/v1/programs?limit=1\" -H \"X-API-Key: $VDP_KEY\"</pre>\n    <p class=\"sub\">Requests without a key return <code>401</code>. Requests above your tier's\n    limit return <code>429</code>. The <code>/health</code> endpoint and the documentation pages\n    need no key.</p>\n  </section>\n\n  <section id=\"limits\">\n    <h2>Rate limits</h2>\n    <div class=\"table-wrap\">\n      <table>\n        <thead><tr><th>Tier</th><th>Requests / minute</th><th>History</th><th>Bulk export</th></tr></thead>\n        <tbody>\n          <tr><td>Free</td><td>120</td><td>30 days</td><td>No</td></tr>\n          <tr><td>Pro</td><td>2,000</td><td>Full</td><td>Yes</td></tr>\n          <tr><td>Enterprise</td><td>Negotiated</td><td>Full, plus backfill</td><td>Yes, plus webhooks</td></tr>\n        </tbody>\n      </table>\n    </div>\n    <p class=\"sub\" style=\"margin-top:14px\">Limits are counted per key per wall-clock minute. Poll the\n    change feed once a minute rather than re-pulling <code>/v1/programs</code>.</p>\n  </section>\n\n  <section id=\"programs\">\n    <h2>Programs</h2>\n    <p class=\"sub\"><code>GET /v1/programs</code> searches the current dataset. All filters are optional\n    and combine with AND.</p>\n    <div class=\"table-wrap\">\n      <table>\n        <thead><tr><th>Parameter</th><th>Type</th><th>Notes</th></tr></thead>\n        <tbody>\n          <tr><td><code>q</code></td><td>string</td><td>Substring match on domain, name or policy URL</td></tr>\n          <tr><td><code>platform</code></td><td>enum</td><td><code>hackerone</code>, <code>bugcrowd</code>, <code>intigriti</code>, <code>yeswehack</code></td></tr>\n          <tr><td><code>source</code></td><td>enum</td><td><code>securitytxt</code>, <code>diodb</code>, or any platform id</td></tr>\n          <tr><td><code>bounty</code></td><td>enum</td><td><code>yes</code> = confirmed paying, <code>no</code> = unconfirmed or VDP-only</td></tr>\n          <tr><td><code>expiry</code></td><td>enum</td><td><code>valid</code>, <code>expired</code>, <code>missing</code> (security.txt Expires state)</td></tr>\n          <tr><td><code>limit</code></td><td>int</td><td>1 to 1,000, default 100</td></tr>\n          <tr><td><code>offset</code></td><td>int</td><td>Default 0</td></tr>\n          <tr><td><code>sort</code></td><td>enum</td><td><code>domain</code>, <code>expiry</code>, <code>expires_on</code>, <code>updated_at</code></td></tr>\n        </tbody>\n      </table>\n    </div>\n<pre>curl -s \"$BASE/v1/programs?expiry=valid&amp;bounty=yes&amp;limit=50\" -H \"X-API-Key: $VDP_KEY\"</pre>\n    <p class=\"sub\">Single record: <code>GET /v1/programs/{domain}</code>. The response includes the\n    program and its last 20 change records.</p>\n  </section>\n\n  <section id=\"changes\">\n    <h2>Change feed</h2>\n    <p class=\"sub\">The feed is append-only and ordered newest first. Use it for monitoring.</p>\n    <div class=\"table-wrap\">\n      <table>\n        <thead><tr><th>Parameter</th><th>Type</th><th>Notes</th></tr></thead>\n        <tbody>\n          <tr><td><code>since</code></td><td>ISO 8601</td><td>Rows with <code>ts &gt;= since</code>; timezone-aware</td></tr>\n          <tr><td><code>kind</code></td><td>enum</td><td><code>added</code>, <code>removed</code>, <code>changed</code></td></tr>\n          <tr><td><code>domain</code></td><td>string</td><td>History for one program</td></tr>\n          <tr><td><code>limit</code></td><td>int</td><td>1 to 1,000, default 200</td></tr>\n        </tbody>\n      </table>\n    </div>\n<pre>curl -s \"$BASE/v1/changes?since=2026-11-21T00:00:00Z&amp;kind=added\" -H \"X-API-Key: $VDP_KEY\"</pre>\n    <p class=\"sub\">Store the newest <code>ts</code> you have seen and pass it back next time.\n    <code>changed</code> rows carry the exact field names plus <code>before</code> and\n    <code>after</code> values.</p>\n  </section>\n\n  <section id=\"model\">\n    <h2>Data model</h2>\n    <div class=\"table-wrap\">\n      <table>\n        <thead><tr><th>Field</th><th>Type</th><th>Meaning</th></tr></thead>\n        <tbody>\n          <tr><td><code>domain</code></td><td>string</td><td>Registrable domain; the primary key</td></tr>\n          <tr><td><code>name</code></td><td>string</td><td>Organization or program name when known</td></tr>\n          <tr><td><code>sources</code></td><td>string[]</td><td>Which feeds contributed to this row</td></tr>\n          <tr><td><code>platforms</code></td><td>string[]</td><td>Platforms that list the org, if any</td></tr>\n          <tr><td><code>policy</code></td><td>string</td><td>Disclosure policy URL</td></tr>\n          <tr><td><code>emails</code></td><td>string[]</td><td>Contacts from the security.txt <code>Contact</code> field</td></tr>\n          <tr><td><code>expiry</code></td><td>enum</td><td><code>valid</code>, <code>expired</code>, <code>missing</code></td></tr>\n          <tr><td><code>offers_bounty</code></td><td>enum</td><td><code>yes</code>, <code>no</code>, <code>partial</code>, null when unknown</td></tr>\n          <tr><td><code>safe_harbor</code></td><td>string</td><td>disclose.io safe-harbor status</td></tr>\n          <tr><td><code>tls_verified</code></td><td>bool</td><td>Whether the security.txt was fetched over a verified chain; false means treat contacts as unverified</td></tr>\n          <tr><td><code>first_seen</code>, <code>last_seen</code></td><td>date</td><td>Snapshot dates</td></tr>\n          <tr><td><code>in_scope_domains</code></td><td>string[]</td><td>Up to 25 in-scope domains from platform data</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"errors\">\n    <h2>Errors</h2>\n    <p class=\"sub\">Errors return a JSON body with a <code>detail</code> string.</p>\n    <div class=\"table-wrap\">\n      <table>\n        <thead><tr><th>Status</th><th>When</th></tr></thead>\n        <tbody>\n          <tr><td><code>401</code></td><td>Missing, invalid or revoked key</td></tr>\n          <tr><td><code>403</code></td><td>Admin key required for <code>/admin/*</code></td></tr>\n          <tr><td><code>404</code></td><td>Unknown domain or change id</td></tr>\n          <tr><td><code>422</code></td><td>Parameter failed validation, for example a bad enum</td></tr>\n          <tr><td><code>429</code></td><td>Tier rate limit exceeded</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </section>\n\n  <section id=\"cadence\">\n    <h2>Cadence and coverage</h2>\n    <p class=\"sub\">The scanner crawls the next Tranco slice every 15 minutes, rebuilds the merged\n    dataset, and records the diff. Upstream platform data refreshes daily. Coverage restarts at the\n    top of the list and wraps, so every domain is revisited.</p>\n    <p class=\"sub\">Current coverage and the last scan run are exposed at\n    <code>GET /v1/stats</code> and <code>GET /v1/runs</code>.</p>\n    <div class=\"note\">Historical depth shown here reflects the current tier. Enterprise accounts can\n    request a full backfill.</div>\n  </section>\n\n  <footer>\n    <div>vdp-hunter \u00b7 <a href=\"/openapi.json\">openapi.json</a> \u00b7 <a href=\"https://github.com/RuneStone0/vdp-hunter\">source</a></div>\n    <div>Questions: <a href=\"mailto:api@vdphunter.com\">api@vdphunter.com</a></div>\n  </footer>\n</div>\n</body>\n</html>\n", "pricing": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>vdp-hunter \u00b7 pricing</title>\n<meta name=\"description\" content=\"vdp-hunter API pricing: free evaluation tier, Pro for production monitoring, Enterprise for custom scope and webhooks.\">\n<style>\n:root {\n  color-scheme: dark;\n  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n  --bg-0: #071827;\n  --bg-1: #0e283f;\n  --panel: rgba(15, 42, 66, 0.72);\n  --panel-solid: #0d2437;\n  --line: rgba(148, 163, 184, 0.18);\n  --text: #dbe7f0;\n  --muted: #94a3b8;\n  --accent: #7dd3fc;\n  --accent-2: #38bdf8;\n  --good: #4ade80;\n  --warn: #fbbf24;\n  --bad: #f87171;\n  --mono: \"SFMono-Regular\", ui-monospace, \"JetBrains Mono\", Menlo, Consolas, monospace;\n  color: var(--text);\n  background: var(--bg-0);\n  line-height: 1.65;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  background:\n    radial-gradient(circle at 20% -10%, rgba(56, 189, 248, 0.16) 0%, transparent 45%),\n    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);\n  background-attachment: fixed;\n}\n\na { color: var(--accent); text-decoration: none; }\na:hover { color: #bae6fd; text-decoration: underline; }\n\n.shell { max-width: 1180px; margin: 0 auto; padding: 28px 22px 64px; }\n\n.topbar {\n  display: flex; align-items: center; justify-content: space-between;\n  gap: 24px; padding-bottom: 18px; margin-bottom: 40px;\n  border-bottom: 1px solid var(--line);\n}\n.brand { display: flex; align-items: center; gap: 12px; }\n.brand-mark {\n  width: 34px; height: 34px; border-radius: 9px;\n
